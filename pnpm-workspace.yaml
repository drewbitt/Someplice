allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
trustPolicyIgnoreAfter: 525600
shellEmulator: true
autoDedupe: true
minimumReleaseAgeExclude:
  - '@sveltejs/adapter-node@6.0.0'
  - '@sveltejs/kit@3.0.0'
# Upstream hasn't declared SvelteKit 3 support yet; verified working (build + e2e).
peerDependencyRules:
  allowedVersions:
    '@vite-pwa/sveltekit>@sveltejs/kit': '3'
    '@deno/svelte-adapter>@sveltejs/kit': '3'
    'runed>@sveltejs/kit': '3'
