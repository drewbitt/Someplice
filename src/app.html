<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Someplice</title>
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// Apply the persisted theme before first paint to avoid a flash of the light theme.
			const theme = localStorage.getItem('theme') || 'light';
			document.documentElement.setAttribute('data-theme', theme);
			// Keep browser chrome in sync with the page background (--color-base-100).
			document
				.querySelector('meta[name="theme-color"]')
				.setAttribute('content', theme === 'dark' ? 'oklch(25.33% 0.016 252.42)' : '#ffffff');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
