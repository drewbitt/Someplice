name: Run Tests

on:
  workflow_call:
    inputs:
      skip-container:
        description: Container checks run separately when publishing an image
        type: boolean
        default: false
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-workflow:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Check types and Svelte components
        run: pnpm check

      - name: Check types with tsgo
        run: pnpm run check:tsgo

      - name: Lint
        run: pnpm lint

      - name: Run Vitest Tests
        run: pnpm test:unit --run

  db:
    runs-on: ubuntu-26.04
    env:
      DATABASE_PATH: /tmp/ci-test.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          save-cache: true

      - name: Migrate a fresh database
        run: pnpm run db:migrate

      - name: Seed smoke test
        run: pnpm run db:seed

  docker:
    if: ${{ !inputs.skip-container }}
    uses: ./.github/workflows/container.yml

  browsers:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      BROWSER: ${{ matrix.browser }}

    steps: &browser-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trust the checkout in the container
        if: ${{ job.container.id }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: |
          # Install again if a Playwright update needs a browser the image doesn't include.
          if [ "$BROWSER" = webkit ] && [ -x "$(node -p 'require("@playwright/test").webkit.executablePath()')" ]; then
            exit 0
          fi
          pnpm exec playwright install --with-deps --only-shell "$BROWSER"

      - name: Run Vitest browser tests
        run: pnpm exec vitest run --project "browser-$BROWSER"

      - name: Run Playwright tests
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_PERFETTO_OUTPUT_FILE: test-results/playwright/perfetto.json.gz
        run: pnpm test:e2e --project "$BROWSER" --add-reporter perfetto

      - name: Upload browser traces and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-results-${{ env.BROWSER }}
          path: |
            test-results/**/*.zip
            test-results/**/perfetto.json.gz
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    # Container comparison: actions/runs/46129272770.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    env:
      BROWSER: webkit
    steps: *browser-steps

  required:
    name: CI passed
    needs: [test-workflow, db, docker, browsers, webkit]
    if: ${{ always() && !inputs.skip-container }}
    runs-on: ubuntu-26.04
    steps:
      - name: Require every CI job to pass
        env:
          PASSED: ${{ needs.test-workflow.result == 'success' && needs.db.result == 'success' && needs.docker.result == 'success' && needs.browsers.result == 'success' && needs.webkit.result == 'success' }}
        run: test "$PASSED" = true
