name: Run Tests

on:
  workflow_call:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-workflow:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Check types and Svelte components
        run: pnpm check

      - name: Check types with tsgo
        run: pnpm run check:tsgo

      - name: Lint
        run: pnpm lint

      - name: Run Vitest Tests
        run: pnpm test:unit --run

  db:
    runs-on: ubuntu-26.04
    env:
      DATABASE_PATH: /tmp/ci-test.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Migrate a fresh database
        run: pnpm run db:migrate

      - name: Seed smoke test
        run: pnpm run db:seed

  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: someplice:ci
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Boot container and smoke test
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: bash tests/docker-smoke.sh someplice:ci

  e2e:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Vitest browser tests
        run: pnpm test:browser --run

      - name: Run Playwright tests
        if: ${{ !cancelled() }}
        run: pnpm test:e2e

      - name: Upload browser failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failures
          path: test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
