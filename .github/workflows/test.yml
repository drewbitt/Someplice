name: Run Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  test-workflow:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Check types and Svelte components
        run: pnpm check

      - name: Check types with tsgo
        run: pnpm run check:tsgo

      - name: Lint
        run: pnpm lint

      - name: Run Vitest Tests
        run: pnpm test:unit --run

  db:
    runs-on: ubuntu-24.04
    env:
      DATABASE_PATH: /tmp/ci-test.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Migrate a fresh database
        run: pnpm run db:migrate
        env:
          NODE_ENV: migration

      - name: Seed smoke test
        run: pnpm run db:seed

      - name: Schema matches generated types
        run: |
          DATABASE_URL=$DATABASE_PATH pnpm run db:codegen
          git diff --exit-code -- src/lib/types/data.d.ts

  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: someplice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Boot container and smoke test
        run: |
          docker run -d --name app -p 3000:3000 someplice:ci
          timeout 90 sh -c 'until curl -fsS http://localhost:3000/ >/dev/null; do sleep 2; done'
          docker logs --tail 30 app

  e2e:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
