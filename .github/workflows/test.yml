name: Run Tests

on:
  workflow_call:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-workflow:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Check types and Svelte components
        run: pnpm check

      - name: Check types with tsgo
        run: pnpm run check:tsgo

      - name: Lint
        run: pnpm lint

      - name: Run Vitest Tests
        run: pnpm test:unit --run

  db:
    runs-on: ubuntu-26.04
    env:
      DATABASE_PATH: /tmp/ci-test.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          save-cache: true

      - name: Migrate a fresh database
        run: pnpm run db:migrate

      - name: Seed smoke test
        run: pnpm run db:seed

  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: someplice:ci
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          # Only push runs export: PR exports cost ~1m on the critical path and
          # can't warm anything the master-run export doesn't already cover.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,scope={0},mode=max', matrix.platform) || '' }}

      - name: Scan image vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image \
            --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 someplice:ci

      - name: Boot container and smoke test
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: bash tests/docker-smoke.sh someplice:ci

  browsers:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell ${{ matrix.browser }}

      - name: Run Vitest browser tests
        run: pnpm exec vitest run --project browser-${{ matrix.browser }}

      - name: Run Playwright tests
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_PERFETTO_OUTPUT_FILE: test-results/playwright/perfetto.json.gz
        run: pnpm test:e2e --project ${{ matrix.browser }} --add-reporter perfetto

      - name: Upload browser traces and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-results-${{ matrix.browser }}
          path: |
            test-results/**/*.zip
            test-results/**/perfetto.json.gz
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    needs: browsers
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Require every browser to pass
        env:
          RESULT: ${{ needs.browsers.result }}
        run: test "$RESULT" = success
