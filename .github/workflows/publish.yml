name: Publish container

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      labels: ${{ steps.metadata.outputs.labels }}
      annotations: ${{ steps.metadata.outputs.annotations }}
      tags: ${{ steps.metadata.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate publishing ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/master
          else
            git merge-base --is-ancestor HEAD origin/master
            node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$/;
          if (!semver.test(version) || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must equal v<package.json version> (without build metadata)');
          }
          if (version.includes('-') !== (process.env.PRERELEASE === 'true')) {
            throw new Error('Release prerelease flag must match the version');
          }
          JS
          fi

      - name: Set registry image name
        id: image
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

  test:
    needs: validate
    uses: ./.github/workflows/test.yml
    with:
      skip-container: true

  docker:
    needs: validate
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ needs.validate.outputs.image }}
      labels: ${{ needs.validate.outputs.labels }}
      annotations: ${{ needs.validate.outputs.annotations }}

  publish:
    needs: [validate, test, docker]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-digest-*
          path: digests

      - name: Tag verified images
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAGS: ${{ needs.validate.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create --metadata-file published.json "${tag_args[@]}" \
            "$IMAGE@$(< digests/image-digest-amd64/digest)" \
            "$IMAGE@$(< digests/image-digest-arm64/digest)"
          digest=$(jq -er '."containerimage.descriptor".digest' published.json)
          printf '`%s`\n\n```text\n%s\n```\n' "$digest" "$TAGS" >> "$GITHUB_STEP_SUMMARY"
