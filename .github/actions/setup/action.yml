name: Setup pnpm + Node
description: Install pnpm, Node.js, and locked dependencies from package.json with pnpm cache
inputs:
  save-cache:
    description: Save the shared pnpm store after this job
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      name: Install pnpm, Node.js, and dependencies
      with:
        cache: true
        save-cache: ${{ inputs.save-cache }}
        require-lockfile: true
