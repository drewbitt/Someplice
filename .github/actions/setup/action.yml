name: Setup pnpm + Node
description: Install pnpm, Node.js, and locked dependencies from package.json with pnpm cache
runs:
  using: composite
  steps:
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      name: Install pnpm, Node.js, and dependencies
      with:
        cache: true
        require-lockfile: true
